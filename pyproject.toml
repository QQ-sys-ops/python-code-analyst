[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "python-code-analyst"
version = "1.0.0"
description = "Python code analysis toolkit designed for AI agents"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Hermes Agent", email = "hermes@example.com"}
]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["code-analysis", "python", "ast", "complexity", "call-graph", "impact-analysis", "dead-code", "dependencies"]
dependencies = [
    "radon>=5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "isort>=5.0",
    "mypy>=0.9",
    "flake8>=4.0",
]

[project.urls]
Homepage = "https://github.com/QQ-sys-ops/python-code-analyst"
Documentation = "https://github.com/QQ-sys-ops/python-code-analyst#readme"
Repository = "https://github.com/QQ-sys-ops/python-code-analyst"
Issues = "https://github.com/QQ-sys-ops/python-code-analyst/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["code_analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true